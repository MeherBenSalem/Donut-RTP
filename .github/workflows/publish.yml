# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID   (DonutRTP: pxKMPaTo)
#   CURSEFORGE_ID (DonutRTP: 1481712)
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find . -type f -path "*/build/libs/DonutRTP-*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" | head -n 5)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No DonutRTP jars in build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const platforms = (process.env.PLATFORMS || 'both').toLowerCase();
          const doModrinth = platforms === 'both' || platforms === 'modrinth';
          const doCurse = platforms === 'both' || platforms === 'curseforge';
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          const PLUGIN_LOADERS = ['bukkit', 'spigot', 'paper', 'purpur', 'folia'];
          let PLUGIN_GAME_VERSIONS = [
            '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
            '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
            '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
            '26.1', '26.1.1', '26.1.2', '26.2', '26.3',
          ];
          if (fs.existsSync('release/supported-minecraft.json')) {
            PLUGIN_GAME_VERSIONS = JSON.parse(fs.readFileSync('release/supported-minecraft.json', 'utf8'));
          }
          let changelog = `Release ${version}`;
          for (const f of ['PATCHNOTES.md', 'PATCH_NOTES.md']) {
            if (fs.existsSync(f)) { changelog = fs.readFileSync(f, 'utf8'); break; }
          }

          (async () => {
            if (doModrinth) {
              const tagRes = await fetch('https://api.modrinth.com/v2/tag/game_version');
              const tags = await tagRes.json();
              const known = new Set(tags.map(t => t.version));
              const game_versions = PLUGIN_GAME_VERSIONS.filter(v => known.has(v));
              for (const jar of jars) {
                const body = {
                  name: version,
                  version_number: version,
                  changelog,
                  dependencies: [],
                  game_versions,
                  version_type: 'release',
                  loaders: PLUGIN_LOADERS,
                  featured: false,
                  status: 'listed',
                  project_id: process.env.MODRINTH_ID,
                  file_parts: ['file_0'],
                  primary_file: 'file_0',
                };
                const form = new FormData();
                form.append('data', JSON.stringify(body));
                form.append('file_0', new Blob([fs.readFileSync(jar)]), path.basename(jar));
                const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                  method: 'POST',
                  headers: { Authorization: process.env.MODRINTH_TOKEN },
                  body: form,
                });
                const mrText = await mrRes.text();
                if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
                console.log('Modrinth OK', body.version_number, path.basename(jar), mrText.slice(0, 160));
              }
            } else {
              console.log('Skipping Modrinth');
            }

            if (!doCurse) {
              console.log('Skipping CurseForge');
              return;
            }

            for (const jar of jars) {
              const gameVersionNames = [
                ...PLUGIN_GAME_VERSIONS,
                'Bukkit', 'Spigot', 'Paper', 'Purpur', 'Folia', 'Client', 'Server',
              ];
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: version,
                gameVersionNames,
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              let ok = false;
              for (let attempt = 1; attempt <= 3; attempt++) {
                const cfRes = await fetch(
                  `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                  { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
                );
                const cfText = await cfRes.text();
                console.log('CurseForge attempt', attempt, cfRes.status, cfText.slice(0, 200));
                if (cfRes.ok) { ok = true; break; }
                if (cfRes.status >= 500) await new Promise(r => setTimeout(r, 15000));
                else break;
              }
              if (!ok) throw new Error('CurseForge upload failed');
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
