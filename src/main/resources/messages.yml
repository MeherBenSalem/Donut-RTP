# DonutRTP 2.0 messages. Colours: &a, &l ... and hex as &#RRGGBB. Empty text = nothing is sent.
# Missing keys fall back to these defaults.
prefix: "&6&lRTP &8» "

# Teleporting
countdown: "&7Teleporting in &e{seconds} &7seconds..."
countdown-actionbar: "&7Teleporting in &e{seconds}&7..."
countdown-title: "&e{seconds}"
countdown-subtitle: "&7Don't move!"
countdown-warning: "&7Don't move or the teleport will be cancelled."
cancelled-move: "&cTeleport cancelled because you moved."
cancelled-damage: "&cTeleport cancelled because you took damage."
searching: "&7Looking for a safe spot..."
teleported: "&aTeleported to &e{x}&a, &e{y}&a, &e{z}&a in &e{destination}&a."
no-safe-location: "&cNo safe spot was found. Try again."
cooldown: "&cYou can teleport again in &e{time}&c."
not-enough-money: "&cYou need &e{cost} &cto teleport there."
charged: "&7Paid &e{cost}&7."
already-teleporting: "&cYou are already teleporting."
unknown-destination: "&cThere is no destination called &e{destination}&c."
destination-no-permission: "&cYou cannot use that destination."
world-not-found: "&cThe world for &e{destination} &cis not loaded."
no-permission: "&cYou do not have permission."
players-only: "&cOnly players can do that."

# /rtp player
sent-player: "&aSending &e{player} &ato &e{destination}&a."
player-not-found: "&cNo player called &e{player} &cis online."

# Zones
zone-countdown-actionbar: "&7Teleporting in &e{seconds}&7..."
zone-countdown-title: "&e{seconds}"
zone-countdown-subtitle: "&7Stay in the zone"
zone-bossbar: "&eRandom teleport in &f{seconds}s &7({players} in the zone)"
zone-waiting: "&7Waiting for &e{needed} &7more player(s)..."
zone-entered: "&eYou entered an RTP zone. Stay inside!"
zone-cancelled: "&cYou left the RTP zone."
zone-cooldown: "&cYou can use an RTP zone again in &e{time}&c."
zone-teleported-group: "&aTeleported with &e{count} &aplayer(s)."

# PlaceholderAPI: %donutrtp_cooldown% when there is no cooldown
placeholder-ready: "&aReady"

# Admin
reloaded: "&aDonutRTP reloaded."
pos-set: "&aCorner {corner} set to &e{x}&a, &e{y}&a, &e{z}&a."
selection-missing: "&cSet both corners first with &e/rtpadmin pos1 &cand &e/rtpadmin pos2&c."
selection-other-world: "&cBoth corners must be in the same world."
zone-created: "&aZone &e{zone} &acreated. It sends players to &e{destination}&a."
zone-deleted: "&aZone &e{zone} &adeleted."
zone-exists: "&cA zone called &e{zone} &calready exists."
zone-not-found: "&cThere is no zone called &e{zone}&c."
zone-updated: "&aZone &e{zone}&a: &e{key} &aset to &e{value}&a."
zone-invalid-value: "&cInvalid value &e{value} &cfor &e{key}&c."
zone-region-missing: "&cWorldGuard region &e{region} &cwas not found in &e{world}&c."
zone-worldguard-missing: "&cWorldGuard is not installed."
update-available: "&e[DonutRTP] &7Update available: &f{version} &7- &b{url}"
