# DonutRTP 2.0 configuration. Reload with /rtpadmin reload.
# Colours: &a, &l ... and hex as &#RRGGBB. Messages are in messages.yml, RTP zones in zones.yml.
config-version: 2

# Seconds to stand still before /rtp or the menu teleports you (0 = instant).
warmup:
  seconds: 5
  # Walking off your block cancels the warmup. Jumping in place never does.
  cancel-on-move: true
  # Taking damage cancels the warmup.
  cancel-on-damage: true
  # Show the countdown on: the action bar, a title, or both.
  actionbar: true
  title: false
  # Sound each second of the countdown (Bukkit name or key, empty = none).
  tick-sound: ""

cooldown:
  # Seconds between teleports. Destinations can override it.
  seconds: 300
  # true: one cooldown for every destination. false: each destination has its own.
  shared: true
  # Shorter cooldowns for ranks: a player with donutrtp.cooldown.<rank> waits that many seconds instead.
  # The lowest one a player has wins.
  ranks:
    vip: 120
    mvp: 60

search:
  # How many spots are tried before giving up.
  max-attempts: 40
  # Safe spots kept ready per destination, so /rtp is instant. 0 = search on demand only.
  pool-size: 3
  # Seconds between background searches that refill the pools.
  refill-seconds: 4
  # Never land inside a WorldGuard region (other than __global__).
  avoid-regions: true
  # Never land inside a GriefPrevention claim.
  avoid-claims: true
  # Stay this many blocks inside the world border.
  border-margin: 8

landing:
  # Seconds without fall damage after landing.
  no-fall-damage-seconds: 5
  # Seconds of full invulnerability after landing (0 = none).
  invulnerable-seconds: 3
  sound: ENTITY_ENDERMAN_TELEPORT
  volume: 1.0
  pitch: 1.0
  # Particles around you when you land (Bukkit particle name, empty = none).
  particle: PORTAL
  # Commands run by the console after a teleport. {player}, {world}, {x}, {y}, {z}, {destination}.
  commands: []

menu:
  title: "&8ʀᴀɴᴅᴏᴍ ᴛᴇʟᴇᴘᴏʀᴛ"
  rows: 3
  fill-empty-slots: true
  filler: GRAY_STAINED_GLASS_PANE
  # Added to an item's lore while you are on cooldown for it ({time}).
  cooldown-lore: "&cAvailable in {time}"
  # Added to an item's lore when you lack its permission.
  locked-lore: "&cYou cannot use this destination."
  # Added to an item's lore when it costs money ({cost}).
  cost-lore: "&7Cost: &e{cost}"

# Where players can be sent. Add as many as you like; each one shows in the menu.
destinations:
  overworld:
    world: world
    # SQUARE or CIRCLE around the centre. The world border is always respected.
    shape: SQUARE
    # {x, z}, or "spawn" for the world's spawn point.
    center: {x: 0, z: 0}
    min-radius: 300
    max-radius: 5000
    min-y: 60
    max-y: 320
    # Biome keys. allow: only these (empty = any). deny: never these.
    biomes:
      allow: []
      deny: [minecraft:ocean, minecraft:deep_ocean, minecraft:cold_ocean, minecraft:deep_cold_ocean,
             minecraft:frozen_ocean, minecraft:deep_frozen_ocean, minecraft:lukewarm_ocean,
             minecraft:deep_lukewarm_ocean, minecraft:warm_ocean, minecraft:river, minecraft:frozen_river]
    # Needed to use it; empty = everyone with donutrtp.use.
    permission: ""
    # Seconds; -1 = the global cooldown.
    cooldown: -1
    # Money per teleport with Vault (0 = free).
    cost: 0
    gui:
      slot: 11
      material: GRASS_BLOCK
      # material: "hdb-46772"     (a HeadDatabase head)
      # head:
      #   texture: "<texture hash or base64>"
      name: "&aOverworld"
      lore:
        - "&7Click to teleport somewhere"
        - "&7random in the Overworld"
  nether:
    world: world_nether
    shape: SQUARE
    center: {x: 0, z: 0}
    min-radius: 100
    max-radius: 4000
    min-y: 32
    max-y: 120
    biomes:
      allow: []
      deny: []
    permission: ""
    cooldown: -1
    cost: 0
    gui:
      slot: 13
      material: NETHERRACK
      name: "&cNether"
      lore:
        - "&7Click to teleport somewhere"
        - "&7random in the Nether"
  end:
    world: world_the_end
    shape: CIRCLE
    center: {x: 0, z: 0}
    # The outer islands start about 1000 blocks out.
    min-radius: 1100
    max-radius: 3000
    min-y: 40
    max-y: 120
    biomes:
      allow: []
      deny: []
    permission: ""
    cooldown: -1
    cost: 0
    gui:
      slot: 15
      material: END_STONE
      name: "&dThe End"
      lore:
        - "&7Click to teleport somewhere"
        - "&7random in The End"

update-check:
  # Check Modrinth for a newer release on startup and tell admins when they join.
  enabled: true
  notify-ops-on-join: true
