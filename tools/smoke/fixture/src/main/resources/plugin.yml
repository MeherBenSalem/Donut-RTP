name: RtpLabFixture
version: 1.0.0
main: io.nightbeam.rtplab.RtpLabPlugin
api-version: '1.20'
folia-supported: true
description: Test-only fixture for the DonutRTP smoke matrix. Never install on a real server.
softdepend: [Vault, VaultUnlocked, WorldEdit, WorldGuard, GriefPrevention]
loadbefore: [DonutRTP]
commands:
  rtplab:
    description: Smoke-test helpers.
    permission: rtplab.admin
permissions:
  rtplab.admin:
    default: op
