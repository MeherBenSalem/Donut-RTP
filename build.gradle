plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'io.nightbeam'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        name = 'extendedclip'
        url = 'https://repo.extendedclip.com/releases/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.MilkBowl'
        }
    }
}

dependencies {
    // The oldest supported API: anything newer is reached only when the running server has it.
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'com.arcaniax:HeadDatabase-API:1.3.2'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        transitive = false
    }
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'org.bstats:bstats-bukkit:3.1.0'

    testImplementation 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 17 bytecode: Paper/Spigot 1.20.1-1.20.4 servers still run on Java 17.
    options.release = 17
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
    from(rootProject.projectDir) {
        include 'LICENSE'
        include 'NOTICE'
        into 'META-INF'
    }
}

shadowJar {
    archiveBaseName.set('DonutRTP')
    archiveClassifier.set('')
    relocate 'org.bstats', 'io.nightbeam.donutrtp.libs.bstats'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.named('test') {
    useJUnitPlatform()
}
