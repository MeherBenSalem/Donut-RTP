plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'io.nightbeam'
version = '1.5.2'

java {
    toolchain {
        // Paper 26.3 API is Java 25 bytecode; the plugin jar still targets 21.
        languageVersion = JavaLanguageVersion.of(25)
    }
    // paper-api 26.3 only publishes a JVM 25 variant. Keep resolving it even though
    // we emit Java 21 bytecode for older Paper/Spigot servers.
    disableAutoTargetJvm()
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
}

dependencies {
    // Latest published 26.3 Paper API (26.3.build.49-alpha). Server builds exist
    // through ALPHA #133; those later fills did not publish a newer API artifact.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.49-alpha'
    compileOnly 'com.arcaniax:HeadDatabase-API:1.3.2'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'

    implementation 'org.bstats:bstats-bukkit:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
    from(rootProject.projectDir) {
        include 'LICENSE'
        include 'NOTICE'
        into 'META-INF'
    }
}

shadowJar {
    archiveBaseName.set('DonutRTP')
    archiveClassifier.set('')
    relocate 'org.bstats', 'io.nightbeam.donutrtp.libs.bstats'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.named('test') {
    useJUnitPlatform()
}
